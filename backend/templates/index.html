<!-- entry file -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Placement Portal. A modern placement management system for students, companies, and administrators." />
  <title>Placement Portal</title>

  <!-- Modern Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- css bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- bootstrap-icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Google Identity Services (OAuth / Sign In) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- my css style  -->
  <link href="/frontend/static/css/custom.css" rel="stylesheet" />

  <!--pwa....pwa features are implemented taking help of LLM(Gemini)  -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
</head>

<body>

  <!-- vue mount here -->
  <div id="app">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1rem;">
      <div class="ppa-spinner"></div>
      <p class="text-muted-custom mt-3" style="font-size: 1rem; font-weight: 500;">Loading Placement Portal App...</p>
    </div>
  </div>


  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
  <!-- DOMPurify for XSS protection -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- init app -->
  <script src="/frontend/src/app.js"></script>

  <!-- router  -->
  <script src="/frontend/src/router.js"></script>

  <!-- pwa sw register..pwa features are implemented taking help of LLM(Gemini) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('pwa sw registered', registration.scope))
          .catch(error => console.error('pwa sw register fail:', error));
      });
    }
  </script>
</body>

</html>
